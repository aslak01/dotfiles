images:
  - location: "https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2"
    arch: "x86_64"
  - location: "https://repo.almalinux.org/almalinux/10/cloud/aarch64/images/AlmaLinux-10-GenericCloud-latest.aarch64.qcow2"
    arch: "aarch64"
# vz = Apple Virtualization.framework (lightest on Apple Silicon)
vmType: "vz"
cpus: 7
memory: "12GiB" # near-full of host's 16GiB, leaving headroom for macOS
disk: "25GiB"

mountType: "virtiofs"
mounts: [] # no host mounts → real isolation for yolo mode

# Lima auto-forwards ALL guest ports to the host's 127.0.0.1 by default.
# This block also exposes them on the host's LAN IP if you want.
portForwards:
  - guestIP: "0.0.0.0"
    hostIP: "0.0.0.0"

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      dnf install -y --setopt=install_weak_deps=False epel-release
      dnf config-manager --set-enabled epel crb
      dnf makecache
      # gcc + gcc-c++: nvim-treesitter compiles each parser from C/C++ source,
      # so a compiler must be present or every parser build fails.
      # unzip: Mason extracts several tools (e.g. stylua) from GitHub release zips.
      # bubblewrap/patch/bzip2: opam needs these to init and build OCaml packages
      # (ocaml-lsp-server is installed via `opam install`).
      dnf install -y --setopt=install_weak_deps=False git make gcc gcc-c++ unzip bubblewrap patch bzip2 podman lsof stow gh
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      # native installer = no Node.js, smaller footprint
      curl -fsSL https://claude.ai/install.sh | bash
      echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
      curl https://mise.run | sh
      eval "$(~/.local/bin/mise activate bash)"
      # persist mise activation so interactive shells get the tool shims on PATH
      echo 'eval "$(mise activate bash)"' >> ~/.bashrc
      # tlrc (tldr client) — not in EPEL; pull the prebuilt binary from GitHub releases
      mise use -g "github:tldr-pages/tlrc[exe=tldr]"
      # lazygit — not in EPEL; mise pulls the prebuilt binary from GitHub releases
      mise use -g lazygit
      mise use -g delta
      echo "alias g=lazygit" >> ~/.bashrc
      # neovim from mise (newer than the EPEL build)
      mise use -g neovim
