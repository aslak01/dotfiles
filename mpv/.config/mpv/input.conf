AXIS_UP             add volume +1
AXIS_DOWN           add volume -1
AXIS_LEFT           osd-msg-bar seek +1
AXIS_RIGHT          osd-msg-bar seek -1
WHEEL_UP            add volume +1
WHEEL_DOWN          add volume -1
WHEEL_LEFT          osd-msg-bar seek +1
WHEEL_RIGHT         osd-msg-bar seek -1

Shift+RIGHT frame-step
Shift+LEFT frame-back-step
# vim-style: h/l seek, H/L big seek, j/k volume, J/K playlist
h seek -5
l seek 5
H seek -65
L seek 65
j add volume -2
k add volume 2
J playlist-next
K playlist-prev
b ab-loop                               # moved from l
B cycle-values loop-file "inf" "no"     # moved from L
v cycle deband
a cycle audio
s cycle sub
i script-binding stats/display-stats
F script-message-to seek_to toggle-seeker
+ add audio-delay 0.010
- add audio-delay -0.010
F1 add sub-delay -0.1
F2 add sub-delay +0.1 
F4 cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
